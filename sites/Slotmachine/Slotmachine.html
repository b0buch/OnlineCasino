<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slotmachine</title>
  <link rel="icon" href="../../img/logonobg.png" type="image/png">
  <link rel="stylesheet" href="slot.css">
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../Info/info.html" class="info-link" id="nav-info">Info</a>
      <a href="../index.html" class="info-link" id="nav-home">Home</a>
    </div>

    <div class="languages">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/8/83/Flag_of_the_United_Kingdom_%283-5%29.svg"
        alt="English"
        onclick="setLanguage('en')"
        class="language-flag"
      >
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Flag_of_Germany.svg"
        alt="Deutsch"
        onclick="setLanguage('de')"
        class="language-flag"
      >
    </div>
  </header>

  <div class="game-container" id="machine">
    <h1 id="title">SLOTMACHINE</h1>

    <div class="balance-container">
      <div class="balance-box"><span id="lbl-balance">Geld</span>: <span id="balance">100</span>$</div>
      <div class="balance-box"><span id="lbl-bet">Einsatz</span>: <span id="current-bet-display">10</span>$</div>
    </div>

    <!-- Walzen -->
    <div class="area">
      <h2 id="lbl-reels">Walzen</h2>
      <div class="reels">
        <div class="reel" id="reel1">
          <div class="symbol-strip">
          <div class="symbol">🍒</div>
          <div class="symbol">🍋</div>
          <div class="symbol">🍊</div>
          <div class="symbol">🍉</div>
          <div class="symbol">⭐</div>
          <div class="symbol">💎</div>
          <div class="symbol">7️⃣</div>
          </div>
        </div>
        <div class="reel" id="reel2">
          <div class="symbol-strip">
          <div class="symbol">🍒</div>
          <div class="symbol">🍋</div>
          <div class="symbol">🍊</div>
          <div class="symbol">🍉</div>
          <div class="symbol">⭐</div>
          <div class="symbol">💎</div>
          <div class="symbol">7️⃣</div>
          </div>
        </div>
        <div class="reel" id="reel3">
          <div class="symbol-strip">
          <div class="symbol">🍒</div>
          <div class="symbol">🍋</div>
          <div class="symbol">🍊</div>
          <div class="symbol">🍉</div>
          <div class="symbol">⭐</div>
          <div class="symbol">💎</div>
          <div class="symbol">7️⃣</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Wettsystem-Steuerung -->
    <div id="betting-controls" class="betting-area">
      <label for="bet-input" id="lbl-select-bet">Einsatz wählen:</label>
      <div class="bet-buttons">
        <button onclick="setBet(10)">+10$</button>
        <button onclick="setBet(25)">+25$</button>
        <button onclick="setBet(50)">+50$</button>
        <button onclick="resetBet()" class="btn-danger" id="reset-btn">Zurücksetzen</button>
      </div>
      <input type="number" id="bet-input" value="10" min="1" step="1">
      <button id="spin-btn" class="btn-start">Drehen</button>
    </div>

    <div id="message"></div>

    <!-- Regeln -->
    <div class="area rules">
      <h2 id="lbl-rules">Spielregeln</h2>
      <p id="rule-1">🎰 Drei gleiche Symbole gewinnen das <strong>2-fache</strong> deines Einsatzes.</p>
      <p id="rule-2">💰 Drei 7️⃣ sind der Jackpot.</p>
    </div>
  </div>

  <footer>
        <p>© 2026 Purple Panda &#45; Online Casino</p>
  </footer>

  <script src="../balance.js"></script>
  <script src="slot.js"></script>
</body>
</html>
