
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎰 Slot Machine</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at top, #444, #080808 75%);

    font-family: Arial, Helvetica, sans-serif;

    color: white;
}


/* =========================
   MACHINE
========================= */

.machine {
    width: 500px;
    max-width: 95%;

    padding: 30px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            #e31b23,
            #76070b
        );

    border: 6px solid gold;

    border-radius: 28px;

    box-shadow:
        0 0 30px rgba(255,215,0,.4),
        inset 0 0 30px rgba(0,0,0,.3);
}


/* =========================
   TITLE
========================= */

h1 {
    margin: 0 0 15px;

    color: gold;

    font-size: 34px;

    text-shadow:
        3px 3px #620000,
        0 0 15px gold;
}


/* =========================
   BALANCE
========================= */

.balance {
    margin-bottom: 20px;

    font-size: 20px;
}

#balance {
    color: #00ff88;

    font-size: 26px;
}


/* =========================
   BET
========================= */

.bet-area {
    margin-bottom: 20px;
}

.bet-label {
    display: block;

    margin-bottom: 8px;

    font-size: 17px;

    font-weight: bold;
}

#bet {
    width: 100%;

    padding: 13px;

    border: 3px solid gold;

    border-radius: 10px;

    outline: none;

    text-align: center;

    font-size: 22px;

    font-weight: bold;
}


/* =========================
   REELS
========================= */

.reels {

    display: flex;

    justify-content: center;

    gap: 12px;

    margin: 25px 0;
}


/* =========================
   REEL
========================= */

.reel {

    width: 120px;
    height: 125px;

    position: relative;

    overflow: hidden;

    background: white;

    border: 5px solid #222;

    border-radius: 15px;

    box-shadow:
        inset 0 0 18px #555,
        0 7px 15px rgba(0,0,0,.7);
}


/*
    Symbol-Streifen
*/

.symbol-strip {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* Symbol */

.symbol {

    width: 100%;
    height: 125px;

    flex-shrink: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    font-size: 62px;

    user-select: none;
}


/* =========================
   SPIN ANIMATION
========================= */


/*
    Alle Walzen drehen gleichzeitig.

    Die Symbole bewegen sich
    von OBEN nach UNTEN.
*/

.reel.spinning .symbol-strip {

    animation:
        spinDown .10s linear infinite;
}


@keyframes spinDown {

    from {
        transform:
            translateY(-125px);
    }

    to {
        transform:
            translateY(0);
    }
}


/* =========================
   STOP EFFECT
========================= */

.reel.stop {

    animation:
        stopBounce .3s ease-out;
}


@keyframes stopBounce {

    0% {
        transform:
            translateY(-12px);
    }

    40% {
        transform:
            translateY(7px);
    }

    70% {
        transform:
            translateY(-3px);
    }

    100% {
        transform:
            translateY(0);
    }
}


/* =========================
   SPIN BUTTON
========================= */

#spinButton {

    width: 100%;

    padding: 17px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            #ffe44d,
            #ffc400
        );

    color: #651000;

    font-size: 24px;

    font-weight: 900;

    cursor: pointer;

    box-shadow:
        0 6px 0 #9c7100,
        0 0 20px rgba(255,215,0,.4);
}


#spinButton:hover {

    filter: brightness(1.1);

}


#spinButton:active {

    transform:
        translateY(5px);

    box-shadow:
        0 1px 0 #9c7100;

}


#spinButton:disabled {

    opacity: .5;

    cursor: not-allowed;

}


/* =========================
   MESSAGE
========================= */

.message {

    min-height: 32px;

    margin-top: 20px;

    font-size: 20px;

    font-weight: bold;
}


.message.win {

    color: #00ff88;

    text-shadow:
        0 0 12px #00ff88;

    animation:
        winAnimation .5s infinite alternate;
}


@keyframes winAnimation {

    from {
        transform:
            scale(1);
    }

    to {
        transform:
            scale(1.1);
    }
}


/* =========================
   JACKPOT
========================= */

.machine.jackpot {

    animation:
        jackpotFlash .3s infinite alternate;
}


@keyframes jackpotFlash {

    from {
        box-shadow:
            0 0 25px gold;
    }

    to {
        box-shadow:
            0 0 70px gold;
    }
}

</style>
</head>


<body>


<div
    class="machine"
    id="machine"
>


    <!-- TITEL -->

    <h1>
        🎰 SLOT MACHINE 🎰
    </h1>


    <!-- GUTHABEN -->

    <div class="balance">

        Guthaben:

        <strong>

            <span id="balance">
                100
            </span>

            Credits

        </strong>

    </div>


    <!-- EINSATZ -->

    <div class="bet-area">

        <label
            class="bet-label"
            for="bet"
        >
            Einsatz
        </label>


        <!--
            Betrag kann direkt
            eingegeben werden.
        -->

        <input
            id="bet"
            type="number"
            min="1"
            step="1"
            value="5"
            inputmode="numeric"
            placeholder="Einsatz eingeben"
        >

    </div>


    <!-- =====================
         WALZEN
    ====================== -->

    <div class="reels">


        <!-- WALZE 1 -->

        <div
            class="reel"
            id="reel1"
        >

            <div class="symbol-strip">

                <div class="symbol">
                    🍒
                </div>

                <div class="symbol">
                    🍋
                </div>

                <div class="symbol">
                    🍊
                </div>

                <div class="symbol">
                    🍉
                </div>

                <div class="symbol">
                    ⭐
                </div>

                <div class="symbol">
                    💎
                </div>

                <div class="symbol">
                    7️⃣
                </div>

            </div>

        </div>


        <!-- WALZE 2 -->

        <div
            class="reel"
            id="reel2"
        >

            <div class="symbol-strip">

                <div class="symbol">
                    🍒
                </div>

                <div class="symbol">
                    🍋
                </div>

                <div class="symbol">
                    🍊
                </div>

                <div class="symbol">
                    🍉
                </div>

                <div class="symbol">
                    ⭐
                </div>

                <div class="symbol">
                    💎
                </div>

                <div class="symbol">
                    7️⃣
                </div>

            </div>

        </div>


        <!-- WALZE 3 -->

        <div
            class="reel"
            id="reel3"
        >

            <div class="symbol-strip">

                <div class="symbol">
                    🍒
                </div>

                <div class="symbol">
                    🍋
                </div>

                <div class="symbol">
                    🍊
                </div>

                <div class="symbol">
                    🍉
                </div>

                <div class="symbol">
                    ⭐
                </div>

                <div class="symbol">
                    💎
                </div>

                <div class="symbol">
                    7️⃣
                </div>

            </div>

        </div>


    </div>


    <!-- SPIN -->

    <button
        id="spinButton"
        type="button"
    >

        🎰 SPIN

    </button>


    <!-- NACHRICHT -->

    <div
        class="message"
        id="message"
    >

        Viel Glück! 🍀

    </div>


</div>



<script>


/* =========================
   EINSTELLUNGEN
========================= */


const symbols = [

    "🍒",
    "🍋",
    "🍊",
    "🍉",
    "⭐",
    "💎",
    "7️⃣"

];


let balance = 100;


/*
    Gewinn = 2 × Einsatz
*/

const winMultiplier = 2;


/* =========================
   ELEMENTE
========================= */


const machine =
    document.getElementById(
        "machine"
    );


const balanceElement =
    document.getElementById(
        "balance"
    );


const betInput =
    document.getElementById(
        "bet"
    );


const spinButton =
    document.getElementById(
        "spinButton"
    );


const message =
    document.getElementById(
        "message"
    );


const reels = [

    document.getElementById(
        "reel1"
    ),

    document.getElementById(
        "reel2"
    ),

    document.getElementById(
        "reel3"
    )

];


/* =========================
   RANDOM
========================= */


function randomSymbol() {

    return symbols[
        Math.floor(
            Math.random() *
            symbols.length
        )
    ];

}


/* =========================
   BALANCE
========================= */


function updateBalance() {

    balanceElement.textContent =
        balance.toLocaleString(
            "de-DE"
        );

}


/* =========================
   EINSATZ
========================= */


function getBet() {

    let bet =
        Number(
            betInput.value
        );


    /*
        Nur ganze Zahlen
    */

    bet =
        Math.floor(bet);


    /*
        Mindesteinsatz
    */

    if (
        !Number.isFinite(bet) ||
        bet < 1
    ) {

        return null;

    }


    /*
        Einsatz darf nicht
        größer als Guthaben sein.
    */

    if (
        bet > balance
    ) {

        return null;

    }


    return bet;

}


/* =========================
   ERGEBNIS
========================= */


function generateResult() {

    return [

        randomSymbol(),

        randomSymbol(),

        randomSymbol()

    ];

}


/* =========================
   WALZEN VORBEREITEN
========================= */


function prepareReel(reel) {

    const strip =
        reel.querySelector(
            ".symbol-strip"
        );


    reel.classList.remove(
        "spinning"
    );

    reel.classList.remove(
        "stop"
    );


    strip.style.transform =
        "translateY(0)";

}


/* =========================
   ALLE WALZEN STARTEN
========================= */


function startAllReels() {

    reels.forEach(
        reel => {

            reel.classList.add(
                "spinning"
            );

        }
    );

}


/* =========================
   WALZE STOPPEN
========================= */


function stopReel(
    reel,
    finalSymbol
) {

    return new Promise(
        resolve => {


            const strip =
                reel.querySelector(
                    ".symbol-strip"
                );


            const symbolElements =
                strip.querySelectorAll(
                    ".symbol"
                );


            /*
                Endsymbol setzen
            */

            symbolElements[0]
                .textContent =
                finalSymbol;


            /*
                Animation stoppen
            */

            reel.classList.remove(
                "spinning"
            );


            /*
                Auf Endposition setzen
            */

            strip.style.transform =
                "translateY(0)";


            /*
                Kleiner Stop-Effekt
            */

            reel.classList.add(
                "stop"
            );


            setTimeout(() => {

                reel.classList.remove(
                    "stop"
                );

                resolve();

            }, 300);

        }
    );

}


/* =========================
   SPIN
========================= */


async function spin() {


    /*
        Einsatz holen
    */

    const bet =
        getBet();


    if (bet === null) {

        message.textContent =
            "❌ Bitte einen gültigen Einsatz eingeben.";

        return;

    }


    /*
        Einsatz abziehen
    */

    balance -= bet;

    updateBalance();


    /*
        UI sperren
    */

    spinButton.disabled =
        true;

    betInput.disabled =
        true;


    machine.classList.remove(
        "jackpot"
    );

    message.classList.remove(
        "win"
    );


    message.textContent =
        `🎰 Einsatz: ${bet} Credits`;


    /*
        Ergebnis erzeugen
    */

    const result =
        generateResult();


    /*
        Walzen vorbereiten
    */

    reels.forEach(
        prepareReel
    );


    /*
        =================================
        ALLE DREI STARTEN GLEICHZEITIG
        =================================
    */

    startAllReels();


    /*
        =================================
        ALLE DREHEN GLEICHZEITIG

        Aber sie stoppen nacheinander,
        damit es realistischer aussieht.
        =================================
    */

    await new Promise(
        resolve => {

            setTimeout(
                resolve,
                1800
            );

        }
    );


    /*
        WALZE 1 STOPPT
    */

    await stopReel(
        reels[0],
        result[0]
    );


    /*
        kurze Pause
    */

    await new Promise(
        resolve => {

            setTimeout(
                resolve,
                180
            );

        }
    );


    /*
        WALZE 2 STOPPT
    */

    await stopReel(
        reels[1],
        result[1]
    );


    /*
        kurze Pause
    */

    await new Promise(
        resolve => {

            setTimeout(
                resolve,
                180
            );

        }
    );


    /*
        WALZE 3 STOPPT
    */

    await stopReel(
        reels[2],
        result[2]
    );


    /*
        =================================
        GEWINN PRÜFEN
        =================================

        NUR XXX GEWINNT.
    */

    const isWin =

        result[0] === result[1] &&

        result[1] === result[2];


    if (isWin) {


        /*
            Auszahlung:

            Einsatz × 2
        */

        const payout =
            bet * winMultiplier;


        balance += payout;


        updateBalance();


        message.classList.add(
            "win"
        );


        /*
            777 = optischer Jackpot
        */

        if (
            result[0] === "7️⃣"
        ) {

            machine.classList.add(
                "jackpot"
            );


            message.textContent =
                `💰 JACKPOT! 777! +${payout} Credits!`;

        }

        else {

            message.textContent =
                `🎉 GEWINN! ${result.join("")} → +${payout} Credits!`;

        }

    }

    else {


        /*
            Verlust:

            Einsatz wurde bereits
            abgezogen.

            Es wird NICHTS
            nochmal abgezogen.
        */

        message.textContent =
            `❌ VERLOREN! ${result.join("")}`;

    }


    /*
        =================================
        EINSATZ PRÜFEN
        =================================
    */

    if (
        balance > 0 &&
        Number(betInput.value) > balance
    ) {

        betInput.value =
            balance;

    }


    /*
        =================================
        KEIN GUTHABEN
        =================================
    */

    if (
        balance <= 0
    ) {

        balance = 0;

        updateBalance();

        spinButton.disabled =
            true;

        betInput.disabled =
            false;

        message.textContent =
            "💸 Kein Guthaben mehr!";

        return;

    }


    /*
        =================================
        WIEDER FREIGEBEN
        =================================
    */

    spinButton.disabled =
        false;

    betInput.disabled =
        false;

}


/* =========================
   SPIN BUTTON
========================= */


spinButton.addEventListener(
    "click",
    spin
);


/* =========================
   ENTER = SPIN
========================= */


betInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            spin();

        }

    }
);


/* =========================
   EINGABE
========================= */


betInput.addEventListener(
    "input",
    () => {

        let value =
            Number(
                betInput.value
            );


        if (
            !Number.isFinite(value)
        ) {

            return;

        }


        value =
            Math.floor(value);


        if (
            value < 1
        ) {

            value = 1;

        }


        /*
            Maximal das vorhandene
            Guthaben einsetzen.
        */

        if (
            value > balance
        ) {

            value = balance;

        }


        betInput.value =
            value;

    }
);


/* =========================
   START
========================= */

updateBalance();

</script>

</body>
</html>
