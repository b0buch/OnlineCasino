<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette</title>
  <link rel="icon" href="../../img/logonobg.png" type="image/png">
  <link rel="stylesheet" href="Styleroulette.css">
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../Info/info.html" class="info-link">Info</a>
      <a href="../index.html" class="info-link" id="nav-home">Home</a>
    </div>
 
    <div class="languages">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/8/83/Flag_of_the_United_Kingdom_%283-5%29.svg"
        alt="English"
        onclick="setLanguage('en')"
        class="language-flag"
      >
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Flag_of_Germany.svg"
        alt="Deutsch"
        onclick="setLanguage('de')"
        class="language-flag"
      >
    </div>
  </header>
 
  <div class="game-container">
    <h1 id="title">ROULETTE</h1>
 
    <div class="balance-container">
      <div class="balance-box"><span id="lbl-balance">Geld</span>: <span id="balance">100</span>$</div>
      <div class="balance-box"><span id="lbl-bet">Einsatz</span>: <span id="current-bet-display">10</span>$</div>
    </div>
 
    <!-- Rad / Ergebnis -->
    <div class="area">
      <h2 id="lbl-result">Ergebnis</h2>
      <div id="wheel" class="wheel green">
        <span id="result">0</span>
      </div>
      <div class="history-wrap">
        <span id="lbl-history" class="history-label">Letzte Zahlen:</span>
        <div id="history" class="history"></div>
      </div>
    </div>
 
    <!-- Wettsystem-Steuerung -->
    <div id="betting-controls" class="betting-area">
      <label for="bet-input" id="lbl-select-bet">Einsatz wählen:</label>
      <div class="bet-buttons">
        <button onclick="setBet(10)">+10$</button>
        <button onclick="setBet(25)">+25$</button>
        <button onclick="setBet(50)">+50$</button>
        <button onclick="resetBet()" class="btn-danger" id="reset-btn">Zurücksetzen</button>
      </div>
      <input type="number" id="bet-input" value="10" min="1" step="1">
 
      <span id="lbl-bet-on" class="sub-label">Setzen auf:</span>
      <div class="choice-buttons">
        <button class="choice red active"  data-choice="red"   id="choice-red">Rot ×2</button>
        <button class="choice black"       data-choice="black" id="choice-black">Schwarz ×2</button>
        <button class="choice green"       data-choice="green" id="choice-green">Grün (0) ×36</button>
      </div>
 
      <button id="spin-btn" class="btn-start">Drehen</button>
    </div>
 
    <div id="message"></div>
  </div>
 
  <footer></footer>
 
  <script src="../balance.js"></script>
  <script src="rouletteJS.js"></script>
</body>
</html>
