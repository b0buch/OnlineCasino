<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roulette</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="Styleroulette.css">
  <link rel="icon" href="/img/logonobg.png" type="image/png">
</head>
<body>
   <header class="Hero">
    <div class="row">
      <div class="col-2">
        <button class="infobutton"><h2><a href="/sites/index.html">Home</a></h2></button>
      </div>
      <div class="col-8"></div>
      <div class="col-2">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Flag_of_Germany.svg" alt="Deutsch" onclick="setLanguage('de')" class="language-flag">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/83/Flag_of_the_United_Kingdom_%283-5%29.svg" alt="English" onclick="setLanguage('en')" class="language-flag">
      </div>
    </div>
  </header>






<div class="gamestyle">
  <div class="game">
    <h1>🎰 Roulette</h1>
    <div id="wheel" class="wheel">
      <span id="result">0</span>
    </div>
    <p class="balance">
      Balance: $<span id="balance">100</span>
    </p>
    <div class="controls">
      <label for="betAmount">Bet amount</label>
      <input id="betAmount" type="number" min="1" value="10">
      <label for="betChoice">
        Bet on
      </label>
      <select id="betChoice">
        <option value="red">Red</option>
        <option value="black">Black</option>
        <option value="green">Green (0)</option>
      </select>

      <button id="spinButton">
        SPIN
      </button>
    </div>
    <p id="message"></p>
  </div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="rouletteJS.js"></script>
</body>
</html>
